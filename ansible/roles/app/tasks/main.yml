# ─── Role: app ────────────────────────────────────────────────────────────────
# Installs Python, pulls repo, builds frontend, installs deps, starts service

- name: Install system dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
      - nodejs
      - npm
      - build-essential
    state: present
    update_cache: yes

- name: Install Node 20 via NodeSource
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node

- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Clone / pull latest code
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    force: yes

- name: Create Python virtual environment
  command: python3 -m venv {{ venv_dir }}
  args:
    creates: "{{ venv_dir }}/bin/activate"

- name: Install Python dependencies
  pip:
    requirements: "{{ app_dir }}/backend/requirements.txt"
    virtualenv: "{{ venv_dir }}"
    state: present

- name: Install frontend dependencies
  npm:
    path: "{{ app_dir }}/frontend"
    state: present

- name: Build frontend
  command: npm run build
  args:
    chdir: "{{ app_dir }}/frontend"
  environment:
    VITE_API_BASE_URL: "http://{{ domain }}"

- name: Copy static build to backend
  synchronize:
    src: "{{ app_dir }}/frontend/dist/"
    dest: "{{ app_dir }}/static/"
    delete: yes
  delegate_to: "{{ inventory_hostname }}"

- name: Write .env file
  template:
    src: env.j2
    dest: "{{ app_dir }}/backend/.env"
    owner: "{{ ansible_user }}"
    mode: "0600"

- name: Install systemd service
  template:
    src: dataflow.service.j2
    dest: /etc/systemd/system/dataflow.service
    owner: root
    mode: "0644"
  notify: Restart dataflow

- name: Enable and start dataflow service
  systemd:
    name: dataflow
    enabled: yes
    state: started
    daemon_reload: yes
