[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "python3 -m venv /app/venv",
  "/app/venv/bin/pip install --upgrade pip",
  "/app/venv/bin/pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd backend && /app/venv/bin/python create_tables.py"
]

[start]
cmd = "cd backend && /app/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
