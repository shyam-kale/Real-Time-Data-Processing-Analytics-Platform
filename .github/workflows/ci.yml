name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Python checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check all Python files compile (syntax)
        run: |
          find backend/app -name "*.py" | xargs python -m py_compile
          echo "✅ All Python files syntax-OK"

      - name: Verify FastAPI app imports cleanly
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-prod"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          DATABASE_URL_SYNC: "sqlite:///./test.db"
        run: |
          cd backend
          python -c "from app.main import app; print('✅ FastAPI app loaded OK')"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — TypeScript build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript + Vite build
        env:
          VITE_API_BASE_URL: ""
          VITE_WS_BASE_URL: ""
        run: |
          cd frontend
          npm run build
          echo "✅ Frontend build OK — $(du -sh dist | cut -f1)"

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker — build image
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t dataflow:ci .
          echo "✅ Docker image built OK"
